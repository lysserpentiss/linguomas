<style>
.login-page {
min-height: 80hv;
display: flex;
align-items: center;
justify-content: center;
background: #FDF8F0;
padding: 40px 20px;
}

.login-container {
max-width: 500px;
width: 100%;
background: white;
border-radius: 30px;
padding: 40px 35px;
box-shadow: 0 20px 60px rgba(0,0,0,0.06);
}

.login-container h1 {
font-family: 'Playfair Display', serif;
font-size: 32px;
text-align: center;
margin-bottom: 8px;
color: #2D2D2D;
}
.login-container .subtitle {
text-align: center;
color: #888;
margin-bottom: 30px;
font-size: 16px;
}
.login-tabs {
display: flex;
gap: 10px;
margin-bottom: 30px;
border-bottom: 2px solid #eee;
}
.login-tabs button {
flex: 1;
padding: 12px;
border: none;
background: transparent;
font-weight: 700;
font-size: 16px;
cursor: pointer;
color: #888;
transition: all 0.3s;
border-bottom: 3px solid transparent;
}
.login-tabs button.active {
color: #B22222;
border-bottom-color: #B22222;
}
.login-tabs button:hover {
color: #B22222;
}		
.form-group {
margin-bottom: 20px;
}
.form-group label {
display: block;
font-weight: 600;
margin-bottom: 6px;
color: #333;
}
.form-group input {
width: 100%;
padding: 14px 18px;
border: 2px solid #e0e0e0;
border-radius: 14px;
font-size: 16px;
transition: border 0.3s;
box-sizing: border-box;
}
.form-group input:focus {
border-color: #B22222;
outline: none;
}
.form-btn {
width: 100%;
padding: 16px;
border: none;
border-radius: 50px;
font-weight: 700;
font-size: 18px;
cursor: pointer;
transition: all 0.3s;
}
.form-btn.login-btn {
background: #B22222;
color: white;
}
.form-btn.login-btn:hover {
background: #8B1A1A;
transform: translateY(-2px);
box-shadow: 0 8px 25px rgba(178, 34, 34, 0.3);
}
.form-btn.register-btn {
background: #006437;
color: white;
}
.form-btn.register-btn:hover {
background: #004D29;
transform: translateY(-2px);
box-shadow: 0 8px 25px rgba(0, 100, 55, 0.3);
}
.form-error {
color: #B22222;
font-size: 14px;
margin-top: 10px;
text-align: center;
}
.form-success {
color: #006437;
font-size: 14px;
margin-top: 10px;
text-align: center;
}
.login-form {
display: block;
}
.register-form {
display: none;
}
.back-link-login {
display: block;
text-align: center;
margin-top: 20px;
color: #888;
text-decoration: none;
font-weight: 600;
transition: color 0.3s;
}
.back-link-login:hover {
color: #B22222;
}
@media (max-width: 480px) {
.login-container {
padding: 25px 20px;
}
}
</style>
</head>

	</nav>

</body>

<main class="login-page">
<div class="login-comtainer">
<h1>🌍 LinguoMas</h1>
<p class="subtitle">Твой личный кабинет для изучения языков</p>

<div class="login-tabs">
<button class="active" data-tab="login">Вход</button>
<button data-tab="register">Регистрация</button>
</div>

<!-- ФОРМА ВХОДА -->
<form class="login-form" id="loginForm" action="login_process.php" method="POST">
<div class="form-group">
<label for="loginUsername">Имя пользователя</label>
<input type="text" id="loginUsername" name="username" placeholder="Введите логин" required>
</div>
<div class="form-group">
<label for="loginPassword">Пароль</label>
<input type="password" id="loginPassword" name="password" placeholder="Введите пароль" required>
</div>
<button type="submit" class="form-btn login-btn">Войти</button>
<div id="loginError" class="form-error"></div>
</form>
 
<!-- ФОРМА РЕГИСТРАЦИИ -->
<form class="register-form" id="registerForm" action="register_process.php" method="POST">
<div class="form-group"
<label for="regUsername">Имя пользователя</label>
<input type="text" id="regUsername" name="username" placeholder="Придумайте логин" required>
</div>
<div class="form-group">
<label for="regEmail">Email</label>
<input type="email" id="regEmail" name="email" placeholder="Ваш email" required>
</div>
<div class="form-group">
<label for="regPassword">Пароль</label>
<input type="password" id="regPassword" name="password" placeholder="Придумайте пароль" required>
</div>
<button type="submit" class="form-btn register-btn">Зарегистрироваться</button>
<div id="registerError" class="form-error"></div>
<div id="registerSuccess" class="form-success"></div>
</form>
 
<a href="index.html" class="back-link-login">← Вернуться на главную</a>
</div>
</main>

<footer class="footer">
<div class="container">
<p>LinguoMas, 2026. Сделано с ❤️ для изучения языков</p>
</div>
</footer>

<!-- ПЕРЕКЛЮЧЕНИЕ МЕЖДУ ФОРМАМИ-->
<script>
const tabs = document.querySelectorAll('.login-tabs button');
const loginForm = document.querySelector('.login-form');
const registerForm = document.querySelector('.register-form');

tabs.forEach(tab => {
tab.addEventListener('click', function() {
tabs.forEach(t => t.classList.remove('active'));
this.classList.add('active');

if (this.dataset.tab === 'login') {
loginForm.style.display = 'block';
registerForm.style.display = 'none';
}
else {
loginForm.style.display = 'none';
registerForm.style.display = 'block';
}
});
});

// Показываем изначально только форму входа
registerForm.style.display = 'none';

</script>
